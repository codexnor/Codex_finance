/* v0.7: isolated, versioned test environment based on v0.4; no cloud backend */
.donut-layout{display:grid;grid-template-columns:minmax(135px,200px) minmax(0,1fr);align-items:center;gap:18px;margin:12px 0 19px}
.donut{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.donut-hole{border-radius:50%;width:69%;height:69%;background:#172840;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:9px;text-align:center;gap:2px}
.donut-hole strong{font-size:clamp(13px,1.6vw,19px);overflow-wrap:anywhere}.donut-hole small{font-size:10px}
.donut-legend{min-width:0}.donot{width:10px;height:10px;flex:none;border-radius:3px}.donut-legend .line{gap:6px;font-size:12px}.donut-legend .line .row{min-width:0;overflow-wrap:anywhere}
.category-group{margin:6px 0}.category-group summary{align-items:center}.category-group .line{font-size:13px}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:50dvh;overflow-y:auto;margin-top:13px}.choice-row{border:1px solid var(--border);border-radius:11px;padding:10px;min-height:44px}
.avatar{width:40px;height:40px;border-radius:12px;background:#244365;border:1px solid #4c6f94;display:inline-grid;place-items:center;flex:none;overflow:hidden;font-size:18px;color:var(--ice)}.avatar img{width:100%;height:100%;object-fit:cover}
.loan-chart{display:block;width:100%;max-width:100%;height:auto;border-radius:12px;background:#14243A}.loan-legend{display:flex;flex-wrap:wrap;gap:8px 19px;margin:11px 0 4px;font-size:12px}.legend-dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
.sim-warning{background:#544232;color:#FFE4B4;padding:13px 15px;border-radius:11px;border:1px solid #C49B55}
@media(max-width:700px){.donut-layout{grid-template-columns:1fr;justify-items:center}.donut{max-width:215px}.donut-legend{width:100%}.choice-grid{grid-template-columns:1fr}}

[hidden]{display:none!important}
#close-modal[hidden]{display:none!important}
.form-error{margin:0 0 12px}
.test-pill{background:#36425B;color:#FDE0A7;border:1px solid #8E7444;font-size:10px;white-space:nowrap}
@media(max-width:400px){.test-pill{padding:4px 6px;font-size:9px}.topbar .name{font-size:14px}}
.loan-chart{margin:10px 0 14px}
#payee-results .clickrow{gap:12px;flex-wrap:wrap}
#account-months:read-only{opacity:.77}
@media(max-width:600px){.loan-chart{min-height:170px}.formgrid .toolbar{flex-wrap:wrap}}

/* v0.7: CSV-import og områdebaserte underkategorier. Ingen tredjepartsavhengigheter. */
.import-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.import-toolbar >label{flex:1 1 215px;min-width:0}
.import-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.import-entry{border:1px solid var(--border);border-radius:13px;background:#14243A;margin:10px 0;overflow:hidden}
.import-entry summary{list-style:none;cursor:pointer;display:flex;gap:9px;align-items:center;padding:13px;min-height:52px}
.import-entry summary::-webkit-details-marker{display:none}.import-entry summary::before{content:'›';color:var(--ice);font-size:20px;flex:none}
.import-entry[open] summary::before{content:'⌄'}.import-entry summary .grow{min-width:0;overflow-wrap:anywhere}
.import-entry summary .meta{font-size:11px;color:var(--muted)}.import-entry .import-fields{padding:0 12px 14px}
.import-fields .formgrid{margin-top:9px}.import-entry input[type=checkbox]{width:18px;height:18px;accent-color:var(--ice)}
.import-entry summary .tag{font-size:10px;border:1px solid var(--border);border-radius:20px;padding:3px 7px;color:var(--muted)}
.import-entry summary .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.import-entry .inline-input{min-width:0}.area-choice-list{display:grid;grid-template-columns:1fr;gap:10px;max-height:55dvh;overflow-y:auto;margin:14px 0}
.area-choice{background:#14243A;border:1px solid var(--border);border-radius:10px;padding:10px}.area-choice .sub-choice{margin:9px 0 0 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.area-choice .toggle{margin:3px 0;align-items:flex-start}.area-choice .toggle input{flex:none;margin-top:2px}
.import-file-note{font-size:12px;color:var(--muted)}.import-cta{position:sticky;bottom:8px;background:var(--panel);padding:12px;border:1px solid var(--border);border-radius:12px;z-index:4}
@media(max-width:650px){.import-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.area-choice .sub-choice{grid-template-columns:1fr}.import-entry summary{flex-wrap:wrap}}

/* v0.7 GitHub PWA: beløp på stolper og kontoarbeidsflate med hurtigregistrering. */
.dashboard-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:13px 0 17px}
.chart-notice{font-size:11px;color:var(--muted);margin-bottom:2px}
.monthchart{min-height:160px;align-items:flex-end}.monthchart .chartcol{justify-content:flex-end;gap:4px}
.monthchart .chart-amount{font-size:11px;font-weight:750;text-align:center;white-space:nowrap;min-height:16px}
.monthchart .chart-short{display:none}.chart-data{margin:12px 0 3px}
.chart-data summary{color:var(--ice);font-size:12px;cursor:pointer;min-height:38px;padding:9px 1px}
.chart-data .line{font-size:12px;padding:8px 1px}
.ledger-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.ledger-layout{display:grid;grid-template-columns:minmax(165px,225px) minmax(0,1fr);gap:13px;align-items:start;margin-top:15px}
.ledger-account-rail{padding:13px}.ledger-section-title{font-size:17px;margin:6px 0 12px}
.ledger-account-link{width:100%;display:grid;text-align:left;gap:4px;background:transparent;border:0;border-radius:10px;padding:12px 10px;color:var(--white)}
.ledger-account-link strong{font-size:12px;color:var(--ice)}.ledger-account-link.active{background:#2B4871}
.ledger-account-link:not(.active):hover{background:#203754}
.ledger-register{min-width:0;padding:15px}.ledger-register h2{margin:0}
.ledger-entry{padding:15px;border:1px solid #5278A2;border-radius:13px;background:#12243B;margin:13px 0 15px}
.ledger-form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.ledger-form-grid label{display:block;min-width:0}
.ledger-form-grid input,.ledger-form-grid select{margin-top:5px;width:100%;font-size:13px;min-height:43px;padding:8px 9px}
.ledger-form-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:12px}
.ledger-form-footer .toolbar{margin:0}
.ledger-tablewrap{overflow-x:auto;width:100%;border:1px solid #334E6D;border-radius:12px}
.ledger-table{border-collapse:collapse;min-width:770px;width:100%;font-size:12px}
.ledger-table th,.ledger-table td{padding:12px 9px;border-bottom:1px solid #344B69;text-align:left;white-space:nowrap}
.ledger-table th{font-size:11px;color:#B3C9E5;background:#1B304F}
.ledger-table td:last-child,.ledger-table td:nth-last-child(2){text-align:right}
.ledger-payee-link{background:none;border:0;padding:6px 0;color:#F2F7FF;font-weight:700;text-decoration:underline;text-decoration-color:#5077A5;text-underline-offset:4px}
.ledger-check{background:#11263E;border:1px solid #52729A;border-radius:8px;width:36px;height:36px;color:#BCD5F2;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
.ledger-check.checked{color:#95F0C5;border-color:#3C9E7E}
.ledger-neg{color:#FFB3BE;white-space:nowrap}.ledger-pos{color:#95EACB;white-space:nowrap}
.ledger-mobile-list{display:none}.ledger-mobile-row{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #334E6D}
.ledger-mobile-detail{display:flex;flex:1;min-width:0;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:7px 0;text-align:left}
.ledger-mobile-detail>span{display:grid;gap:5px;min-width:0}.ledger-mobile-detail strong{overflow-wrap:anywhere}.ledger-mobile-detail small{color:var(--muted)}
.pwa-update{position:fixed;z-index:130;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:530px;margin:auto;padding:14px;background:#263E5E;border:1px solid var(--ice);border-radius:14px;box-shadow:0 10px 40px #000A;display:none;align-items:center;gap:13px;justify-content:space-between}

<div class="shell">
<aside class="sidebar"><div class="brand"><strong>CODEX FINANCE</strong><span>POLAR BLUE · TESTVERSJON</span></div><nav id="desktopnav" aria-label="Hovedmeny"></nav><div class="sidebar-foot">v0.7 · Separat TEST-lagring. Ingen skysynkronisering.<p>Original Codex-logo legges inn når godkjent fil foreligger.</p></div></aside>
<div class="main"><header class="topbar"><div class="row"><button class="iconbtn hidden" id="back" aria-label="Tilbake">‹</button><span class="name" id="top-title">Codex Finance</span><span class="pill test-pill">TEST v0.7</span></div><div class="actions"><span class="pill" id="saved-status">Lokal</span><button class="btn small top-long" id="quick-add">+ Ny post</button><button class="iconbtn" id="quick-add-small" aria-label="Ny postering">+</button></div></header><main id="view" class="view"></main></div>

<script>
(()=>{'use strict';
const VERSION='0.7.0', DB_NAME='codex-finance-pwa-test-v070', STATE_KEY='codex-finance-pwa-fallback-v070';
const NAV=[['oversikt','Oversikt','⌂'],['budsjett','Budsjett','▤'],['kontoer','Kontoer','▦'],['sparing','Sparing','◉'],['mer','Mer','☰']];
const CAT_SEED={
 'Bolig':['Husleie','Felleskostnader','Kommunale avgifter','Eiendomsskatt','Eiendomsvedlikehold'],
 'Mat og dagligvarer':['Dagligvarer','Husholdningsartikler','Restaurant','Takeaway','Lunsj/jobbmat'],
 'Forsikring':['Boligforsikring','Bilforsikring','Innboforsikring','Reiseforsikring','Livsforsikring','Uføreforsikring','Barneforsikring','Dyreforsikring','Annen forsikring'],
 'Drivstoff og energi':['Bensin','Diesel','Elbillading','Båtdrivstoff','Annet drivstoff'],
 'Vedlikehold':['Bolig','Bil','Båt','Hytte','Hage','Elektronikk og utstyr'],
 'Transport':['Bompenger','Parkering','Kollektivt','Taxi','Billett'],
 'Strøm og kommunikasjon':['Strøm','Nettleie','Mobil','Internett','TV'],
 'Abonnement':['Strømming','Programvare','Medlemskap','Apper','Annet abonnement'],
 'Barn og familie':['Barnehage','SFO','Aktiviteter','Skole','Klær og utstyr'],
 'Helse':['Lege','Tannlege','Medisiner','Behandling','Trening'],
 'Fritid og reise':['Ferie','Overnatting','Aktiviteter','Hobby','Spill'],
 'Shopping og personlig':['Klær','Elektronikk','Møbler','Personlig pleie','Annet'],
 'Gaver og merkedager':['Bursdag','Jul','Konfirmasjon','Bryllup','Andre gaver'],
 'Gebyrer og øvrige kostnader':['Bankgebyr','Fakturagebyr','Renter','Offentlige gebyrer','Diverse'],
 'Bil og kjøretøy':['Dekk','EU-kontroll','Service og reparasjon','Bilvask og bilpleie','Kjøretøyavgifter','Tilbehør og utstyr'],
 'Kjæledyr':['Fôr','Veterinær','Utstyr','Pass og stell'],
 'Økonomi og avgifter':['Banktjenester','Regnskap','Medlemskontingent','Øvrige avgifter'],
 'Uklassifisert':[]
};
let db=null,storage='memory';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString('en-CA');
const ym=()=>today().slice(0,7);
const pad=(s)=>String(s).padStart(2,'0');
const num=(v)=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const positive=v=>Math.max(0,num(v));
const money=n=>new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK',maximumFractionDigits:0}).format(num(n));
const comma=n=>new Intl.NumberFormat('nb-NO',{maximumFractionDigits:1}).format(num(n));
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const s=v=>h(v);
const firstDay=(month)=>month+'-01';
const prettyMonth=v=>new Intl.DateTimeFormat('nb-NO',{month:'long',year:'numeric'}).format(new Date(v+'-01T12:00:00'));
const AREA_SUGGESTIONS={
'Bil':['Bil og kjøretøy','Forsikring','Drivstoff og energi','Vedlikehold','Transport','Gebyrer og øvrige kostnader'],
'Bolig':['Bolig','Forsikring','Strøm og kommunikasjon','Vedlikehold','Gebyrer og øvrige kostnader'],
'Barn':['Barn og familie','Helse','Shopping og personlig','Forsikring','Gaver og merkedager','Transport'],
'Mat og husholdning':['Mat og dagligvarer','Shopping og personlig'],
'Ferie og fritid':['Fritid og reise','Transport','Mat og dagligvarer','Gaver og merkedager'],
'Ferie':['Fritid og reise','Transport','Mat og dagligvarer'],
'Privat':['Shopping og personlig','Helse','Abonnement','Transport','Mat og dagligvarer'],
'Felles':['Bolig','Forsikring','Mat og dagligvarer','Strøm og kommunikasjon','Barn og familie','Abonnement'],
'Sparing':[]};

// Kontekststyrte valg: samme hovedkategori kan foreslå forskjellige underkategorier per område.
const AREA_SUB_NAMES={
 'Bil':{'Forsikring':['Bilforsikring'],'Drivstoff og energi':['Bensin','Diesel','Elbillading','Annet drivstoff'],'Vedlikehold':['Bil'],'Transport':['Bompenger','Parkering'],'Bil og kjøretøy':['Dekk','EU-kontroll','Service og reparasjon','Bilvask og bilpleie','Kjøretøyavgifter','Tilbehør og utstyr'],'Gebyrer og øvrige kostnader':['Offentlige gebyrer','Fakturagebyr']},
 'Bolig':{'Forsikring':['Boligforsikring','Innboforsikring'],'Vedlikehold':['Bolig','Hage'],'Bolig':['Husleie','Felleskostnader','Kommunale avgifter','Eiendomsskatt','Eiendomsvedlikehold'],'Strøm og kommunikasjon':['Strøm','Nettleie','Internett','TV']},
 'Barn':{'Forsikring':['Barneforsikring','Ulykkesforsikring'],'Barn og familie':['Barnehage','SFO','Aktiviteter','Skole','Klær og utstyr'],'Helse':['Lege','Tannlege','Medisiner'],'Shopping og personlig':['Klær'],'Transport':['Kollektivt']},
 'Mat og husholdning':{'Mat og dagligvarer':['Dagligvarer','Husholdningsartikler','Restaurant','Takeaway','Lunsj/jobbmat']},
 'Ferie og fritid':{'Forsikring':['Reiseforsikring'],'Fritid og reise':['Ferie','Overnatting','Aktiviteter','Hobby','Spill'],'Transport':['Kollektivt','Taxi','Billett'],'Mat og dagligvarer':['Restaurant','Takeaway']},
 'Felles':{'Forsikring':['Boligforsikring','Innboforsikring','Reiseforsikring','Barneforsikring'],'Vedlikehold':['Bolig','Hage'],'Mat og dagligvarer':['Dagligvarer','Husholdningsartikler','Restaurant','Takeaway']}
};
function initialAreaSubIds(ar,categories){const mapping=AREA_SUB_NAMES[ar.name]||{},o={};for(const c of categories){if(!mapping[c.name])continue;o[c.id]=c.subs.filter(sub=>mapping[c.name].includes(sub.name)).map(sub=>sub.id)}return o}
// Empty per-category rule means no subcategories suggested, not all available. Unconfigured categories retain all for backwards compatibility.
function categoriesForArea(areaId,showAll=false,current=''){const ar=area(areaId);const all=activeCats();if(showAll||!ar||!ar.suggestedCategories?.length)return all;return all.filter(c=>ar.suggestedCategories.includes(c.id)||c.id===current||c.name==='Uklassifisert')}
function subsForArea(areaId,categoryId,showAll=false,current=''){const c=cat(categoryId);if(!c)return [];const all=c.subs.filter(sub=>!sub.archived||sub.id===current);if(showAll)return all;const ids=area(areaId)?.suggestedSubIds?.[categoryId];if(!Array.isArray(ids))return all;return all.filter(sub=>ids.includes(sub.id)||sub.id===current)}
function refreshTxCategoryOptions(changed){const f=document.querySelector('#modal form[data-form="tx"]');if(!f||f.elements.type.value!=='expense')return;const ar=f.elements.areaId?.value,catSelect=f.elements.categoryId,subSelect=f.elements.subId,all=f.elements.showAllCats?.checked;
 if(!catSelect||!subSelect)return;const oldCat=catSelect.value,oldSub=subSelect.value;const allowed=categoriesForArea(ar,all);const selectedCat=allowed.some(c=>c.id===oldCat)?oldCat:(allowed[0]?.id||'');
 catSelect.innerHTML=allowed.map(c=>`<option value="${s(c.id)}">${s(c.name)}</option>`).join('');catSelect.value=selectedCat;
 const subs=subsForArea(ar,selectedCat,all,changed==='payee'?oldSub:'');subSelect.innerHTML='<option value="">Ingen</option>'+subs.map(v=>`<option value="${s(v.id)}">${s(v.name)}</option>`).join('');subSelect.value=subs.some(x=>x.id===oldSub)?oldSub:'';
}

function seed(){const categories=Object.entries(CAT_SEED).map(([name,subs])=>({id:uid(),name,archived:false,subs:subs.map(name=>({id:uid(),name,archived:false}))}));const areaNames=['Privat','Felles','Bolig','Bil','Barn','Mat og husholdning','Ferie og fritid','Sparing','Til gjennomgang'];const seedAreas=areaNames.map(name=>({id:uid(),name,archived:false,suggestedCategories:(AREA_SUGGESTIONS[name]||[]).map(n=>categories.find(c=>c.name===n)?.id).filter(Boolean)}));seedAreas.forEach(ar=>ar.suggestedSubIds=initialAreaSubIds(ar,categories));return {version:VERSION,categories,areas:seedAreas,accounts:[],tx:[],payees:[],importAliases:{},allocations:{},goals:[],savingTargets:[{from:'1900-01',mode:'percent',value:12}],salary:{},pensionRights:[],settings:{currentMonth:ym(),budgetArea:'all',scope:'all',valueView:'type',savingTargetPercent:12,savingTargetMode:'percent',defaultsV04:true},created:new Date().toISOString()}}
let data=seed(),page='oversikt',history=[],params={},modalName='',renderSeq=0;
function openDb(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej(Error('Ingen IndexedDB'));const q=indexedDB.open(DB_NAME,2);q.onupgradeneeded=()=>{const d=q.result;for(const name of ['system','receipts','payeeImages'])if(!d.objectStoreNames.contains(name))d.createObjectStore(name)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||Error('Databasefeil'))})}
function dbGet(store,key){return new Promise((res,rej)=>{const req=db.transaction(store,'readonly').objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,value,key){return new Promise((res,rej)=>{const req=db.transaction(store,'readwrite').objectStore(store).put(value,key);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const req=db.transaction(store,'readwrite').objectStore(store).delete(key);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}
async function init(){data=migrate(data);try{db=await openDb();storage='indexeddb';const saved=await dbGet('system','main');if(saved && saved.categories) data=migrate(saved)}catch(err){try{const saved=localStorage.getItem(STATE_KEY);if(saved){data=migrate(JSON.parse(saved))}storage='localStorage';}catch{storage='memory'}}updateStatus();render()}
function migrate(a){
 const b=seed();if(!a||typeof a!=='object')return b;
 for(const key of ['categories','areas','accounts','tx','goals','salary','pensionRights','payees','savingTargets'])if(a[key] && (Array.isArray(a[key])||key==='salary'))b[key]=a[key];
 b.importAliases=a.importAliases&&typeof a.importAliases==='object'&&!Array.isArray(a.importAliases)?a.importAliases:{};b.allocations=a.allocations||{};b.settings={...b.settings,...(a.settings||{})};
 if(!Array.isArray(b.savingTargets)||!b.savingTargets.length){b.savingTargets=[{from:'1900-01',mode:b.settings.savingTargetMode||'percent',value:b.settings.savingTargetMode==='amount'?positive(b.settings.savingTargetAmount):positive(b.settings.savingTargetPercent)}]}
 b.accounts.forEach(acc=>{if(acc.type==='loan' && !acc.payoffDate && positive(acc.months))acc.legacyMonths=acc.months});
 // Existing users get missing standard areas/categories exactly once, without undoing their archived choices.
 if(!a.settings?.defaultsV04){
  const wanted=['Privat','Felles','Bolig','Bil','Barn','Mat og husholdning','Ferie og fritid','Sparing'];
  for(const name of wanted)if(!b.areas.some(x=>x.name.toLocaleLowerCase('nb-NO')===name.toLocaleLowerCase('nb-NO')))b.areas.push({id:uid(),name,archived:false,suggestedCategories:[]});
  for(const [name,subs]of Object.entries(CAT_SEED))if(!b.categories.some(x=>x.name===name))b.categories.push({id:uid(),name,archived:false,subs:subs.map(name=>({id:uid(),name,archived:false}))});
  b.settings.defaultsV04=true;
 }
 for(const ar of b.areas)if(!Array.isArray(ar.suggestedCategories)||!ar.suggestedCategories.length && !ar.suggestionsEdited){ar.suggestedCategories=(AREA_SUGGESTIONS[ar.name]||[]).map(n=>b.categories.find(c=>c.name===n)?.id).filter(Boolean)}
 for(const ar of b.areas){if(!ar.suggestedSubIds || typeof ar.suggestedSubIds!=='object') ar.suggestedSubIds=initialAreaSubIds(ar,b.categories)}
  if(!b.categories.some(c=>c.name==='Uklassifisert')) b.categories.push({id:uid(),name:'Uklassifisert',archived:false,subs:[]});
  if(!b.areas.some(a=>a.name==='Til gjennomgang')) b.areas.push({id:uid(),name:'Til gjennomgang',archived:false,suggestedCategories:[],suggestedSubIds:{},suggestionsEdited:true});
  b.version=VERSION;return b;
}
let saveBusy=Promise.resolve();function save(){const snapshot=JSON.parse(JSON.stringify(data));saveBusy=saveBusy.catch(()=>{}).then(async()=>{if(storage==='indexeddb')await dbPut('system',snapshot,'main');else if(storage==='localStorage')localStorage.setItem(STATE_KEY,JSON.stringify(snapshot));updateStatus()}).catch(err=>{notify('Lagring mislyktes. Eksporter JSON!');console.error('Save error:',err)});return saveBusy}
function updateStatus(){const e=document.getElementById('saved-status');e.textContent=storage==='indexeddb'?'Lagret lokalt':storage==='localStorage'?'Lokal lagring': 'Uten lagring';e.className='pill '+(storage==='memory'?'warn':'good')}
let toastTimeout;function notify(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('on'),3500)}
function item(id,list){return list.find(x=>x.id===id)}
function acc(id){return item(id,data.accounts)}
function cat(id){return item(id,data.categories)}
function area(id){return item(id,data.areas)}
function isAsset(a){return a && ['bank','asset'].includes(a.type)}
function isDebt(a){return a && ['credit','loan','liability'].includes(a.type)}
function typeName(t){return ({bank:'Bankkonto',credit:'Kreditt',loan:'Lån',asset:'Eiendel',liability:'Øvrig gjeld'})[t]||t}
function subtypeOptions(t){return ({bank:['Brukskonto','Lønnskonto','Sparekonto','Bufferkonto','Annen bankkonto'],credit:['Kredittkort','Delbetaling / handlekonto','Kredittramme'],loan:['Boliglån','Billån','Studielån','Forbrukslån','Fritidsboliglån','Andre lån'],asset:['Aksjer og fond','Bolig og eiendom','Kjøretøy','Privat pensjonskapital','Andre eiendeler'],liability:['Privat gjeld','Skattegjeld','Andre forpliktelser']})[t]||[]}
function accountBalance(a){return num(a.opening)+data.tx.reduce((sum,t)=>{if(t.type==='expense'&&t.accountId===a.id)return sum-num(t.amount);if(t.type==='income'&&t.accountId===a.id)return sum+num(t.amount);if(t.type==='transfer'){if(t.fromId===a.id)sum-=num(t.amount);if(t.toId===a.id)sum+=num(t.amount)}return sum},0)}
function netWorth(all=false){return data.accounts.filter(a=>all||(isDebt(a)||a.inNetWorth!==false)).reduce((sum,a)=>sum+accountBalance(a),0)}
function totalByType(type,month=data.settings.currentMonth){return data.tx.filter(t=>t.type===type&&(!month||t.date?.startsWith(month))).reduce((x,t)=>x+num(t.amount),0)}
function spending(month,catId=null,areaId=null,subId=null){return data.tx.filter(t=>t.type==='expense'&&(!month||t.date?.startsWith(month))&&(!catId||t.categoryId===catId)&&(!areaId||t.areaId===areaId)&&(!subId||t.subId===subId)).reduce((sum,t)=>sum+num(t.amount),0)}
function selectedMonth(){return data.settings.currentMonth||ym()}
function txSavings(t){if(t.type==='saving')return t.direction==='withdraw'?-num(t.amount):num(t.amount);if(t.type!=='transfer')return 0;const from=acc(t.fromId),to=acc(t.toId);return (to?.savingsEligible?1:0)-(from?.savingsEligible?1:0)?((to?.savingsEligible?1:0)-(from?.savingsEligible?1:0))*num(t.amount):0}
function savings(month=null){return data.tx.filter(t=>!month||t.date?.startsWith(month)).reduce((sum,t)=>sum+txSavings(t),0)}
function salarySum(o){const gross=num(o.base)+num(o.ot50Hours)*num(o.ot50Rate)+num(o.ot100Hours)*num(o.ot100Rate)+num(o.exerciseQty)*num(o.exerciseRate)+num(o.guardQty)*num(o.guardRate)+num(o.comp)+num(o.other);const spk=num(o.spkBase);const tax=o.actualTax===''||o.actualTax===null||o.actualTax===undefined?gross*num(o.taxPercent)/100:num(o.actualTax);const pens=o.actualPension===''||o.actualPension===null||o.actualPension===undefined?spk*num(o.pensionPercent)/100:num(o.actualPension);return {gross,spk,tax,pens,net:o.actualNet===''||o.actualNet===null||o.actualNet===undefined?gross-tax-pens-num(o.otherDeductions):num(o.actualNet),nav:num(o.navBase)}}
function salaryNet(month){return data.salary[month]?salarySum(data.salary[month]).net:0}
function savingPercent(month){const net=salaryNet(month);return net>0?100*savings(month)/net:null}
function yearlyStats(year){let saved=0,net=0;for(const m of Array.from({length:12},(_,i)=>year+'-'+pad(i+1))){saved+=savings(m);net+=salaryNet(m)}return {saved,net,pct:net>0?100*saved/net:null}}
function yearMonthShift(v,shift){const [y,m]=v.split('-').map(Number);const dt=new Date(y,m-1+shift,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
function currAccountTotals(){return {bank:data.accounts.filter(a=>a.type==='bank').reduce((s,a)=>s+accountBalance(a),0),credit:data.accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+accountBalance(a),0),loan:data.accounts.filter(a=>a.type==='loan').reduce((s,a)=>s+accountBalance(a),0)}}
function button(name,act,cls='secondary'){return `<button class="btn ${cls}" data-action="${s(act)}">${name}</button>`}
function rowBtn(title,subtitle,value,action,icon='↗'){return `<button class="clickrow" data-action="${s(action)}"><span class="row grow"><span class="glyph">${icon}</span><span class="grow"><strong>${s(title)}</strong><div class="subtle">${s(subtitle)}</div></span></span><strong class="nowrap">${s(value)}</strong><span style="color:var(--ice)">›</span></button>`}
function top(title,description='',action=''){return `<div class="headline"><div><div class="kicker">${s(description)}</div><h1>${s(title)}</h1></div>${action}</div>`}
function info(msg){return `<div class="hint">${msg}</div>`}
function stat(name,value,note='',cls=''){return `<div class="stat"><div class="key">${s(name)}</div><div class="value ${cls}">${s(value)}</div>${note?`<small>${s(note)}</small>`:''}</div>`}
function line(name,value,detail=''){return `<div class="line"><div class="grow"><div class="title">${s(name)}</div>${detail?`<div class="sub">${s(detail)}</div>`:''}</div><div class="amount">${s(value)}</div></div>`}
function pill(text,cls=''){return `<span class="pill ${cls}">${s(text)}</span>`}
function empty(text){return `<div class="empty">${s(text)}</div>`}
function field(name,label,value='',type='text',extra=''){return `<label>${s(label)}<input name="${s(name)}" type="${type}" value="${s(value)}" ${extra}></label>`}
function select(name,label,options,current='',extra=''){return `<label>${s(label)}<select name="${s(name)}" ${extra}>${options.map(x=>{const [v,title]=Array.isArray(x)?x:[x,x];return `<option value="${s(v)}"${String(v)===String(current)?' selected':''}>${s(title)}</option>`}).join('')}</select></label>`}
function checked(name,label,val){return `<label class="toggle"><input type="checkbox" name="${s(name)}" ${val?'checked':''}>${s(label)}</label>`}
function monthControl(){return `<label style="max-width:185px">Periode<input type="month" id="month-input" value="${s(selectedMonth())}"></label>`}
function activeCats(){return data.categories.filter(x=>!x.archived)}
function activeAreas(){return data.areas.filter(x=>!x.archived)}
function accOpts(filter=()=>true){return data.accounts.filter(filter).map(a=>[a.id,a.name+' ('+typeName(a.type)+')'])}
function catOpts(){return activeCats().map(a=>[a.id,a.name])}
function areaOpts(){return activeAreas().map(a=>[a.id,a.name])}
function monthTabs(base){return `<div class="row between wrap" style="margin-bottom:14px">${monthControl()}${base||''}</div>`}
function section(name,content){return `<div class="section"><h2>${s(name)}</h2>${content||''}</div>`}
function progress(percent){return `<div class="progress"><span style="width:${Math.max(0,Math.min(100,percent))}%"></span></div>`}
function chartMonths(fn,monthCount=6,unit='kr'){
 const m=selectedMonth(),vals=Array.from({length:monthCount},(_,i)=>{const date=yearMonthShift(m,i-monthCount+1);return {date,v:fn(date)}});
 const hi=Math.max(...vals.map(x=>Math.max(0,x.v)),1);

function calcLoanMonths(a,at=today()){
 if(!a.payoffDate||!/^\d{4}-\d{2}-\d{2}$/.test(a.payoffDate))return null;
 const day=Math.min(31,Math.max(1,positive(a.dueDay)||1)),d=monthAsDate(at),end=monthAsDate(a.payoffDate);if(!Number.isFinite(end.getTime())||end<=d)return null;
 let yy=d.getFullYear(),mm=d.getMonth()+1;let due=dueDateForMonth(yy,mm,day);if(due<=at){mm++;if(mm>12){yy++;mm=1}}
 let count=0;while(count<1200){const cursor=dueDateForMonth(yy,mm,day);if(cursor>a.payoffDate){if(count===0)return 1;break}count++;mm++;if(mm>12){yy++;mm=1}}
 return count||1;
}

function loanBasePayment(principal,r,n){return r===0?principal/n:principal*r/(1-Math.pow(1+r,-n))}

function scheduleLoan(P,rate,periods,fee,options={}){
 const r=rate/1200,dates=options.dates||[],base=loanBasePayment(P,r,periods),extra=num(options.extra),mode=options.mode||'none',strategy=options.strategy||'short';let bal=P,payment=base,paidExtra=0,totalInt=0,totalFees=0,totalPaid=0,applied=false;const rows=[];

  const date=dates[i]||'–',interest=bal*r,ordinary=Math.min(bal+interest,payment),installment=Math.max(0,ordinary-interest);
  let extraPay=0;
  if(mode==='monthly')extraPay=Math.min(Math.max(0,bal-installment),extra);
  if(mode==='once'&&!applied&&date>=options.onceDate){extraPay=Math.min(Math.max(0,bal-installment),extra);applied=true}
  bal=Math.max(0,bal-installment-extraPay);totalInt+=interest;totalFees+=fee;totalPaid+=ordinary+extraPay+fee;paidExtra+=extraPay;
  rows.push({date,balance:bal,interest,fee,paid:ordinary+extraPay+fee,extra:extraPay});
  if(mode==='once'&&strategy==='low'&&applied&&bal>0){const remaining=periods-i-1;if(remaining>0)payment=loanBasePayment(bal,r,remaining)}
 }
 if(bal>0.01)return {error:'Betalingsplanen dekker ikke lånet innenfor beregnet løpetid'};
 return {rows,months:rows.length,interest:totalInt,fees:totalFees,totalPaid,extraPaid:paidExtra,firstPayment:base,remaining:bal,endDate:rows.at(-1)?.date||''};
}

function renderSavingHistory(){const m=selectedMonth(),y=m.slice(0,4),yearData=yearlyStats(y),annual=savingAnnualGoal(y);return top('Sparehistorikk',y)+`<div class="grid3">${stat('Spart i år',money(yearData.saved))}${stat('Samlet nettolønn',money(yearData.net))}${stat('Spareandel',yearData.pct===null?'–':comma(yearData.pct)+' %')}${stat('Sum sparebudsjett',money(annual.sum),'Kjente månedsmål')}</div><div class="card">${section('Mål og faktisk sparing per måned')}<div class="tablewrap"><table class="table"><thead><tr><th>Måned</th><th>Mål som gjaldt</th><th>Mål kr</th><th>Netto lønn</th><th>Spart</th><th>Andel</th><th>Avvik</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{const mo=y+'-'+pad(i+1),v=savings(mo),n=salaryNet(mo),t=targetForMonth(mo),goal=targetAmount(mo);return `<tr><td>${s(mo)}</td><td>${t.mode==='amount'?money(t.value):comma(t.value)+' %'}</td><td>${goal===null?'–':money(goal)}</td><td>${data.salary[mo]?money(n):'–'}</td><td>${money(v)}</td><td>${n?comma(100*v/n)+' %':'–'}</td><td>${goal===null?'–':money(v-goal)}</td></tr>`}).join('')}</tbody></table></div><p class="subtle">Årlig spareprosent = samlet faktisk sparing delt på samlet registrert nettolønn. Historiske målsatser beholdes ved senere endringer.</p></div>`}

function salaryRows(){return Object.entries(data.salary).sort((a,b)=>b[0].localeCompare(a[0]))}
function salaryBreakdown(o){const b=num(o.base),ot50=num(o.ot50Hours)*num(o.ot50Rate),ot100=num(o.ot100Hours)*num(o.ot100Rate),exercise=num(o.exerciseQty)*num(o.exerciseRate),guard=num(o.guardQty)*num(o.guardRate),comp=num(o.comp),other=num(o.other);return [{name:'Fastlønn',value:b},{name:'Overtid 50 %',value:ot50},{name:'Overtid 100 %',value:ot100},{name:'Øvelse',value:exercise},{name:'Vakt',value:guard},{name:'Økonomisk kompensasjon',value:comp},{name:'Øvrige tillegg',value:other}]}
function salaryChart(o){const v=salarySum(o),parts=salaryBreakdown(o),gross=v.gross;return `<div class="cols"><div>${section('Hva består bruttolønnen av?')}${donut(parts,gross,'Total brutto')}</div><div>${section('Fra brutto til netto')}${line('Bruttolønn',money(gross))}${line('Skattetrekk',money(-v.tax))}${line('Pensjonstrekk',money(-v.pens))}${line('Andre trekk',money(-num(o.otherDeductions)))}${line('Beregnet netto',money(gross-v.tax-v.pens-num(o.otherDeductions)))}${o.actualNet!==''&&o.actualNet!==undefined?line('Faktisk netto (manuelt registrert)',money(v.net)):''}<p class="subtle">Pensjonsgrunnlaget vises separat. Overtid eller tillegg regnes ikke automatisk som pensjonsgivende.</p></div></div>`}
function salaryAnnualChart(year){const points=Array.from({length:12},(_,i)=>year+'-'+pad(i+1));const rows=points.filter(m=>data.salary[m]);if(!rows.length)return empty('Registrer en lønnsmåned for å vise lønnsutviklingen.');return `<div class="tablewrap"><table class="table"><thead><tr><th>Måned</th><th>Fastlønn</th><th>Tillegg</th><th>Brutto</th><th>Skatt</th><th>Pensjonstrekk</th><th>Netto</th></tr></thead><tbody>${rows.map(m=>{const o=data.salary[m],v=salarySum(o);return `<tr><td><button class="naked" data-action="salaryEditor:${m}">${s(m)}</button></td><td>${money(o.base)}</td><td>${money(v.gross-num(o.base))}</td><td>${money(v.gross)}</td><td>${money(v.tax)}</td><td>${money(v.pens)}</td><td>${money(v.net)}</td></tr>`}).join('')}</tbody></table></div>`}
function renderSalary(){const rows=salaryRows(),year=selectedMonth().slice(0,4),totals=rows.filter(x=>x[0].startsWith(year)).reduce((x,[_,a])=>{const y=salarySum(a);x.gross+=y.gross;x.net+=y.net;x.tax+=y.tax;x.pension+=y.pens;return x},{gross:0,net:0,tax:0,pension:0});const selected=data.salary[selectedMonth()];return top('Lønn','Brutto, overtid 50/100 %, øvelse, vakt og kompensasjon',button('+ Lønnsmåned','salaryEditor:'+selectedMonth(),'small'))+info('Fast grunnlønn, variable tillegg og samlet bruttolønn holdes atskilt. SPK- og NAV-grunnlag er selvstendige felt. Skatte- og pensjonssatser er knyttet til hver enkelt måned.')+`<div class="stats">${stat('Bruttolønn '+year,money(totals.gross))}${stat('Netto utbetalt '+year,money(totals.net))}${stat('Skatt trukket '+year,money(totals.tax))}${stat('Pensjonstrekk '+year,money(totals.pension))}</div>${selected?`<div class="card">${section('Lønnsfordeling · '+prettyMonth(selectedMonth()))}${salaryChart(selected)}</div>`:''}<div class="card">${section('Lønn per måned')}${salaryAnnualChart(year)}</div><div class="card">${section('Registrerte lønnsmåneder')}${rows.length?rows.map(([mo,o])=>rowBtn(prettyMonth(mo),'Skatt: '+money(salarySum(o).tax)+' · Pensjon: '+money(salarySum(o).pens),money(salarySum(o).net),'salaryEditor:'+mo,'▣')).join(''):empty('Ingen lønnsmåneder er registrert ennå.')}</div><div class="toolbar">${button('Skatt','tax','small secondary')}${button('Pensjon','pension','small secondary')}</div>`}
function renderSalaryEditor(){const mo=params.month||selectedMonth(),o=data.salary[mo]||{base:0,ot50Hours:0,ot50Rate:0,ot100Hours:0,ot100Rate:0,exerciseQty:0,exerciseRate:0,guardQty:0,guardRate:0,comp:0,other:0,spkBase:0,navBase:0,taxPercent:30,pensionPercent:2,actualTax:'',actualPension:'',actualNet:'',otherDeductions:0},v=salarySum(o);const ff=(name,label)=>field(name,label,o[name]??'', 'number','step="0.01"');return top('Lønnsmåned',prettyMonth(mo))+info('Hver måned lagres som egen registrering. Ny skatteprosent/pensjonssats påvirker ikke andre måneder. Faktiske trekk i kr overstyrer prosentsats i denne måneden.')+`<form id="salary-form" data-form="salary" data-month="${s(mo)}"><div class="card"><div class="section"><h2>1. Fastlønn og overtid</h2></div><div class="formgrid">${ff('base','Fast månedslønn / grunnlønn (kr)')}${ff('ot50Hours','Overtid 50 % – timer')}${ff('ot50Rate','Overtid 50 % – utbetalt sats kr/time')}${ff('ot100Hours','Overtid 100 % – timer')}${ff('ot100Rate','Overtid 100 % – utbetalt sats kr/time')}</div><div class="section"><h2>2. Aktivitetstillegg og kompensasjon</h2></div><div class="formgrid">${ff('exerciseQty','Øvelse – timer/døgn')}${ff('exerciseRate','Øvelse – sats per enhet')}${ff('guardQty','Vakt – timer/døgn')}${ff('guardRate','Vakt – sats per enhet')}${ff('comp','Økonomisk kompensasjon (kr)')}${ff('other','Øvrige tillegg / etterbetaling (kr)')}</div><p class="subtle">Satsene gjelder utbetalt sats per time/enhet. Bruk egne lønnsslippbeløp dersom beregningsgrunnlaget avviker.</p></div><div class="card"><div class="section"><h2>3. Skatt, pensjon og netto</h2></div><div class="formgrid">${ff('taxPercent','Skattetrekk (%)')}${ff('actualTax','Faktisk trukket skatt (kr, valgfritt)')}${ff('pensionPercent','Pensjonstrekk (%)')}${ff('actualPension','Faktisk pensjonstrekk (kr, valgfritt)')}${ff('spkBase','Pensjonsgrunnlag SPK (kr)')}${ff('navBase','Pensjonsgivende NAV-grunnlag (kr)')}${ff('otherDeductions','Andre trekk (kr)')}${ff('actualNet','Faktisk netto utbetalt (kr, valgfritt)')}</div><p class="subtle">Pensjonsgrunnlag og NAV-grunnlag er egne opplysninger. Vi antar ikke at brutto- eller nettolønn er pensjonsgivende.</p></div><div class="card">${section('Beregnet fra lagrede felt')}${line('Bruttolønn inkl. tillegg',money(v.gross))}${line('Skattetrekk',money(v.tax))}${line('Pensjonstrekk',money(v.pens))}${line('Netto utbetalt',money(v.net))}${salaryChart(o)}<div class="toolbar"><button class="btn" type="submit">Lagre denne måneden</button><button class="btn secondary" type="button" data-action="salaryIncome:${mo}">Registrer utbetaling på konto</button></div></div></form><div class="subtle" style="margin-top:10px">Beløpene i oppsummeringen oppdateres etter lagring. Registrering som bankinntekt er valgfritt og kontrolleres mot eksisterende posteringer.</div>`}
function renderTax(){const rows=salaryRows(),yr=selectedMonth().slice(0,4),list=rows.filter(x=>x[0].startsWith(yr));const taxed=list.reduce((x,[m,o])=>x+salarySum(o).tax,0),gross=list.reduce((x,[m,o])=>x+salarySum(o).gross,0);return top('Skatt','Forskuddstrekk, ikke endelig skatt')+info('Skattetrekk fra lønn er forskudd på skatt, ikke penger du har som eiendel. Hver måned bruker sin egen registrerte sats og faktiske beløp.')+`<div class="grid2">${stat('Skatt trukket '+yr,money(taxed))}${stat('Andel av registrert bruttolønn',gross?comma(100*taxed/gross)+' %':'–')}</div><div class="card">${section('Skatt måned for måned')}<div class="tablewrap"><table class="table"><thead><tr><th>Måned</th><th>Brutto</th><th>Trekk %</th><th>Faktisk/anslått</th></tr></thead><tbody>${list.map(([m,o])=>`<tr><td><button class="naked" data-action="salaryEditor:${m}">${s(m)}</button></td><td>${money(salarySum(o).gross)}</td><td>${comma(o.taxPercent)} %</td><td>${money(salarySum(o).tax)}</td></tr>`).join('')}</tbody></table></div>${!list.length?empty('Registrer lønnsmåneder for å følge skattetrekket.'):''}</div>`}

function render(){const seq=++renderSeq;const labels={oversikt:'Oversikt',transactions:'Posteringer',txDetail:'Postering',budsjett:'Budsjett',areaReport:'Budsjettområde',categoryReport:'Utgiftstype',categories:'Kategorier',areas:'Budsjettområder',kontoer:'Kontoer',accountDetail:'Kontodetaljer',loanSim:'Nedbetalingssimulator',sparing:'Sparing',goal:'Sparemål',savingHistory:'Sparehistorikk',mer:'Mer',salary:'Lønn',salaryEditor:'Lønnsmåned',tax:'Skatt',pension:'Pensjon',wealth:'Formue',reports:'Statistikk',payees:'Mottakere',payeeDetail:'Mottaker',bankImport:'Bankimport',data:'Data'};document.getElementById('top-title').textContent=labels[page]||'Codex Finance';document.getElementById('back').classList.toggle('hidden',NAV.some(x=>x[0]===page));document.getElementById('desktopnav').innerHTML=NAV.map(n=>`<button class="navlink ${page===n[0]?'active':''}" data-nav="${n[0]}"><span style="font-size:21px;width:22px;text-align:center">${n[2]}</span>${n[1]}</button>`).join('');document.getElementById('bottomnav').innerHTML=NAV.map(n=>`<button class="${page===n[0]?'active':''}" data-nav="${n[0]}"><span>${n[2]}</span>${n[1]}</button>`).join('');const views={oversikt:renderOverview,transactions:renderTransactions,txDetail:renderTxDetail,budsjett:renderBudget,areaReport:renderAreaReport,categoryReport:renderCategoryReport,categories:renderCategories,areas:renderAreas,kontoer:renderAccounts,accountDetail:renderAccountDetail,loanSim:renderLoanSim,sparing:renderSavings,goal:renderGoal,savingHistory:renderSavingHistory,mer:renderMore,salary:renderSalary,salaryEditor:renderSalaryEditor,tax:renderTax,pension:renderPension,wealth:renderWealth,reports:renderReports,payees:renderPayees,payeeDetail:renderPayeeDetail,bankImport:renderBankImport,data:renderData};try{document.getElementById('view').innerHTML=(views[page]||renderOverview)()+`<div class="footer">CODEX FINANCE · v${VERSION} · PWA-test · Lokal lagring per enhet · Ingen bankforbindelse</div>`}catch(err){console.error(err);document. let importDraft=null;
const normalizedDescription=v=>String(v||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleUpperCase('nb-NO');
function textDecoderBank(buffer){try{return new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch{return new TextDecoder('windows-1252').decode(buffer)}}
function csvRows(text,delimiter){const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===delimiter){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push([...row]);row.length=0;cell=''}else cell+=ch}if(quoted)throw Error('CSV har en tekstverdi med uavsluttet anførselstegn.');if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push([...row])}return rows}
function bankAmount(raw){const str=String(raw||'').trim();if(!str)return null;const value=str.replace(/[\s\u00A0\u202F]/g,'').replace(/\./g,str.includes(',')?'':'.').replace(',','.');if(!/^-?\d+(?:\.\d{1,2})?$/.test(value))throw Error('Ugyldig beløp: '+str);const amount=Number(value);if(!Number.isFinite(amount)||Math.abs(amount)>1e12)throw Error('Ugyldig beløp.');return Math.round(amount*100)/100}
function bankDate(raw){const m=String(raw).trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(!m)throw Error('Ugyldig dato: '+raw);const iso=`${m[3]}-${m[2]}-${m[1]}`;const d=new Date(iso+'T12:00:00Z');if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==iso)throw Error('Ugyldig kalenderdato: '+raw);return iso}
function importFingerprint(accountId,row){return JSON.stringify([accountId,row.date,Math.round(row.amount*100),normalizedDescription(row.description),row.occurrence])}
function findImportDuplicate(row,accountId){const key=importFingerprint(accountId,row);row.fingerprint=key;row.exactDuplicate=data.tx.some(t=>t.importFingerprint===key);row.softDuplicate=!row.exactDuplicate&&data.tx.some(t=>t.accountId===accountId&&t.date===row.date&&Math.round(num(t.amount)*100)===Math.abs(Math.round(row.amount*100))&&normalizedDescription(t.rawDescription||t.payee||'')===normalizedDescription(row.description)&&t.type===(row.amount<0?'expense':'income'));
 if(row.exactDuplicate||row.softDuplicate)row.include=false}
function importDefaultCategory(){return data.categories.find(c=>c.name==='Uklassifisert')?.id||activeCats()[0]?.id||''}
function importDefaultArea(){return data.areas.find(a=>a.name==='Til gjennomgang')?.id||activeAreas()[0]?.id||''}
async function loadSnnCSV(file){try{if(!file||file.size>8*1024*1024)throw Error('Velg en CSV-fil på maksimalt 8 MB.');const text=textDecoderBank(await file.arrayBuffer()).replace(/^\uFEFF/,'');const firstLine=text.split(/\r?\n/,1)[0]||'';const delimiters=[';','\t',','];const delimiter=delimiters.map(d=>({d,n:csvRows(firstLine,d)[0]?.length||0})).sort((a,b)=>b.n-a.n)[0].d;const all=csvRows(text,delimiter);if(all.length<2)throw Error('Filen inneholder ingen transaksjoner.');const headers=all[0].map(v=>normalizedDescription(v).toLocaleLowerCase('nb-NO'));const indexes=['dato','beskrivelse','inn','ut'].map(v=>headers.indexOf(v));if(indexes.some(x=>x<0))throw Error('Finner ikke kolonnene Dato, Beskrivelse, Inn og Ut. Velg original SNN CSV.');const [di,bi,ii,ui]=indexes;const rows=[],errors=[],seen={};for(let i=1;i<all.length;i++){const cells=all[i];if(cells.length!==all[0].length){errors.push(`Rad ${i+1}: ${cells.length} felt, forventet ${all[0].length}.`);continue}try{const date=bankDate(cells[di]),description=String(cells[bi]||'').trim();if(!description)throw Error('Tom beskrivelse.');const inside=bankAmount(cells[ii]),outside=bankAmount(cells[ui]);if((inside===null)===(outside===null))throw Error('Det må være beløp i nøyaktig én av Inn/Ut.');if(inside!==null&&inside<=0)throw Error('Inn må være positiv.');if(outside!==null&&outside===0)throw Error('Ut kan ikke være null.');const amount=inside!==null?inside:-Math.abs(outside),kind=amount<0?'expense':'income';const norm=normalizedDescription(description);const dupBase=JSON.stringify([date,Math.round(amount*100),norm]);const occurrence=(seen[dupBase]||0)+1;seen[dupBase]=occurrence;const alias=data.importAliases?.[norm];let payeeId=alias?.payeeId&&payee(alias.payeeId)?alias.payeeId:'';if(!payeeId){const p=data.payees.find(p=>normalizedDescription(p.name)===norm);if(p)payeeId=p.id}rows.push({date,description,amount,kind,originalKind:kind,occurrence,include:true,payeeId,newPayee:'',areaId:alias?.areaId&&area(alias.areaId)?alias.areaId:(payeeId&&area(payee(payeeId)?.areaId)?payee(payeeId).areaId:importDefaultArea()),categoryId:alias?.categoryId&&cat(alias.categoryId)?alias.categoryId:(payeeId&&cat(payee(payeeId)?.categoryId)?payee(payeeId).categoryId:importDefaultCategory()),subId:alias?.subId||(payeeId?payee(payeeId)?.subId||'':''),counterAccountId:'',remember:!!payeeId,exactDuplicate:false,softDuplicate:false})}catch(err){errors.push(`Rad ${i+1}: ${err.message}`)}}
 if(!rows.length)throw Error('Fant ingen gyldige transaksjoner. '+errors.slice(0,2).join(' '));if(errors.length)throw Error(`${errors.length} rader må korrigeres i CSV før import: ${errors.slice(0,4).join(' | ')}`);
 const prior=importDraft?.accountId||'';importDraft={fileName:file.name,rows,accountId:prior&&acc(prior)?prior:data.accounts.find(a=>a.type==='bank')?.id||'',delimiter,expanded:[]};for(const row of rows)findImportDuplicate(row,importDraft.accountId);render();notify(`${rows.length} transaksjoner lest. Kontroller før import.`)
 }catch(err){notify('CSV kan ikke leses: '+err.message);const box=document.querySelector('#csv-error');if(box)box.textContent=err.message}}
function importPayeeOpts(row){return [['','Behold original bankbeskrivelse'],...(data.payees||[]).filter(p=>!p.archived||p.id===row.payeeId).map(p=>[p.id,p.name]),['__new__','+ Opprett ny mottaker']]}
function renderBankImport(){const banks=accOpts(a=>a.type==='bank');let output=top('Bankimport fra SNN','CSV → mottakere → kategorier → kontoposteringer')+info('Filen behandles kun lokalt. Originaltekst fra banken bevares, også om du velger et annet mottakernavn. CSV-filen legges ikke inn i programkoden.')+`<div class="card"><div class="import-toolbar"><label>SNN CSV-fil<input id="snn-csv-file" type="file" accept=".csv,text/csv,text/plain"></label><label>Bankkonto som filen gjelder<select id="snn-bank-account"><option value="">Velg bankkonto</option>${banks.map(([id,name])=>`<option value="${s(id)}" ${importDraft?.accountId===id?'selected':''}>${s(name)}</option>`).join('')}</select></label></div><p class="import-file-note">SNN-format: Dato, Beskrivelse, Inn, Ut. Støtter semikolon, UTF-8, norsk dato og desimalkomma. Ut kan allerede være negativ.</p><div class="sim-warning" id="csv-error" style="margin:10px 0">${banks.length?'Kontroller at riktig bankkonto er valgt før du bekrefter import.':'Ingen bankkonto finnes ennå. Gå til Kontoer og opprett en bankkonto først.'}</div></div>`;

 const rows=importDraft.rows,active=rows.filter(x=>x.include),duplicate=rows.filter(x=>x.exactDuplicate||x.softDuplicate).length;
 output+=`<div class="card"><div class="row between wrap"><strong>${s(importDraft.fileName)}</strong>${button('Tøm forhåndsvisning','importClear','small secondary')}</div><div class="import-summary">${stat('Transaksjoner',String(rows.length))}${stat('Valgt for import',String(active.length))}${stat('Mulige duplikater',String(duplicate))}</div><div class="toolbar">${button('Hopp over mulige duplikater','importSkipDuplicates','small secondary')}</div><p class="subtle">Kontroller spesielt betaling til kredittkort, overføringer og innbetalinger. De behandles ikke automatisk som sparing. «Uklassifisert» og «Til gjennomgang» kan kategoriseres senere.</p></div>`;
 output+=`<div class="card">${section('Gjennomgå transaksjoner')}<p class="subtle">Trykk på en transaksjon for å endre mottaker, kategori eller behandling.</p>${rows.map((r,i)=>`<details class="import-entry" data-import-entry="${i}" ${importDraft.expanded?.includes(i)?'open':''}><summary><span class="grow"><strong>${s(r.description)}</strong><div class="meta">${s(r.date)} · ${r.exactDuplicate?'Allerede importert':r.softDuplicate?'Mulig duplikat':r.include?'Klar til import':'Hoppes over'}</div></span><span class="amt" style="color:${r.amount<0?'var(--bad)':'var(--good)'}">${s(money(r.amount))}</span></summary><div class="import-fields"><div class="formgrid"><label class="full toggle"><input type="checkbox" data-import-idx="${i}" data-import-field="include" ${r.include?'checked':''}>Ta med transaksjonen</label>${selectImport(i,'kind','Behandling',[['expense','Utgift'],['income','Inntekt'],['transfer','Overføring mellom egne kontoer'],['skip','Hopp over']],r.kind)}${r.kind==='transfer'?selectImport(i,'counterAccountId','Motkonto (må velges)',[['','Velg en annen konto'],...accOpts(a=>a.id!==importDraft.accountId)],r.counterAccountId):''}${r.kind!=='transfer'&&r.kind!=='skip'?`${selectImport(i,'payeeId','Mottaker / avsender',importPayeeOpts(r),r.payeeId)}${r.payeeId==='__new__'?inputImport(i,'newPayee','Navn på ny mottaker',r.newPayee):''}${r.kind==='expense'?`${selectImport(i,'areaId','Budsjettområde',areaOpts(),r.areaId)}${selectImport(i,'categoryId','Utgiftstype',categoriesForArea(r.areaId,true,r.categoryId).map(c=>[c.id,c.name]),r.categoryId)}${selectImport(i,'subId','Underkategori',[['','Ingen'],...subsForArea(r.areaId,r.categoryId,false,r.subId).map(x=>[x.id,x.name])],r.subId)}`:''}<label class="full toggle"><input type="checkbox" data-import-idx="${i}" data-import-field="remember" ${r.remember?'checked':''}>Husk kobling til mottaker ved neste import</label>`:''}</div><div class="subtle">Bankbeskrivelse beholdes: ${s(r.description)}</div>${r.exactDuplicate||r.softDuplicate?`<div class="sim-warning">${r.exactDuplicate?'Denne transaksjonen er registrert fra samme bankkonto før.':'En tilsvarende transaksjon finnes allerede på bankkontoen.'} Eksakt tidligere import kan ikke importeres på nytt. Andre mulige duplikater kan vurderes manuelt.</div>`:''}</div></details>`).join('')}</div>`;
 output+=`<div class="import-cta"><div class="row between wrap"><span><strong>${active.length} av ${rows.length}</strong> valgt</span>${button('Bekreft import','importConfirm','')}</div><div class="subtle">Ingen postering lagres før du bekrefter. Du kan gå tilbake og endre forslagene.</div></div>`;return output}
function selectImport(idx,name,label,options,current){return `<label>${s(label)}<select data-import-idx="${idx}" data-import-field="${name}">${options.map(([v,title])=>`<option value="${s(v)}" ${String(v)===String(current)?'selected':''}>${s(title)}</option>`).join('')}</select></label>`}

function handleBankImportChange(t){if(t.id==='snn-csv-file'){const file=t.files?.[0];if(file)loadSnnCSV(file);return true}if(t.id==='snn-bank-account'){if(importDraft){importDraft.accountId=t.value;for(const r of importDraft.rows){r.exactDuplicate=false;r.softDuplicate=false;findImportDuplicate(r,t.value)}render()}return true}if(!t.dataset.importField||!importDraft)return false;
 const row=importDraft.rows[Number(t.dataset.importIdx)];if(!row)return true;importDraft.expanded=[...document.querySelectorAll('details[data-import-entry][open]')].map(el=>Number(el.dataset.importEntry));const key=t.dataset.importField;row[key]=t.type==='checkbox'?t.checked:t.value;if(key==='kind'&&row.kind==='skip')row.include=false;else if(key==='kind')row.include=true;if(key==='areaId'||key==='categoryId')row.subId='';if(key==='payeeId')row.remember=!!row.payeeId;render();return true}

async function confirmBankImport(){if(!importDraft)return;const draft=importDraft;if(!acc(draft.accountId)||acc(draft.accountId).type!=='bank'){notify('Velg bankkontoen som CSV-filen gjelder.');return}const chosen=draft.rows.filter(r=>r.include&&r.kind!=='skip');if(!chosen.length){notify('Ingen transaksjoner er valgt.');return}if(!confirm(`Importer ${chosen.length} transaksjoner til «${acc(draft.accountId).name}»? Sjekk at kredittkortbetaling og egne overføringer er korrekt merket.`))return;
 const snapshot=JSON.parse(JSON.stringify(data));let newRecipients=0,created=0;try{for(const r of chosen){if(r.exactDuplicate)throw Error('En allerede importert post er valgt. Fjern duplikat før du fortsetter.');if(r.kind==='transfer'&&(!acc(r.counterAccountId)||r.counterAccountId===draft.accountId))throw Error('Velg en gyldig motkonto for overføring: '+r.description);if(!['expense','income','transfer'].includes(r.kind))throw Error('Ukjent behandlingstype.');if(r.kind==='expense'&&(!cat(r.categoryId)||!area(r.areaId)))throw Error('Kategori og budsjettområde mangler for: '+r.description);if(r.payeeId==='__new__'&&!r.newPayee.trim())throw Error('Skriv navn på ny mottaker for '+r.description)}
 const createdByName={};for(const r of chosen){let id=r.payeeId;if(id==='__new__'){const name=r.newPayee.trim(),key=normalizedDescription(name);let p=data.payees.find(p=>normalizedDescription(p.name)===key)||createdByName[key];if(!p){p={id:uid(),name,archived:false,categoryId:r.categoryId||'',areaId:r.areaId||'',accountId:draft.accountId,assetId:''};data.payees.push(p);createdByName[key]=p;newRecipients++}id=p.id}
 const kind=r.kind,amount=Math.abs(r.amount),tx={id:uid(),type:kind,date:r.date,amount,note:'Importert fra SNN CSV',source:'snn-csv',rawDescription:r.description,importFingerprint:r.fingerprint,importedAt:new Date().toISOString(),payee:r.description};
 if(kind==='transfer'){tx.fromId=r.amount<0?draft.accountId:r.counterAccountId;tx.toId=r.amount<0?r.counterAccountId:draft.accountId;tx.payee='Overføring: '+r.description;tx.fromBankAccountId=draft.accountId}
 else {tx.accountId=draft.accountId;tx.payeeId=id&&id!=='__new__'?id:'';tx.payee=payee(tx.payeeId)?.name||r.description;if(kind==='expense'){tx.categoryId=r.categoryId;tx.subId=r.subId||'';tx.areaId=r.areaId}}

 if(r.remember && tx.payeeId && kind!=='transfer'){data.importAliases[normalizedDescription(r.description)]={payeeId:tx.payeeId,categoryId:r.categoryId||'',subId:r.subId||'',areaId:r.areaId||''}}
 }
 await save();importDraft=null;go('transactions');notify(`Importerte ${created} posteringer og opprettet ${newRecipients} mottakere.`)

function bufferToBase64(blob){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=()=>reject(fr.error);fr.readAsDataURL(blob)})}

async function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text());if(json.app!=='Codex Finance'||!json.data?.categories||!Array.isArray(json.data.tx))throw Error('Ikke en gyldig Codex Finance-backup.');if(!confirm('Import erstatter alle nåværende registreringer. Fortsette?'))return;const loaded=migrate(json.data);if(db&&json.receipts){for(const [id,entry]of Object.entries(json.receipts)){if(!/^[\w-]{4,64}$/.test(id)||!entry?.base64)continue;const binary=atob(entry.base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);await dbPut('receipts',new Blob([bytes],{type:entry.type||'image/jpeg'}),id)}}if(db&&json.payeeImages){for(const [id,entry]of Object.entries(json.payeeImages)){if(!/^[\w-]{4,64}$/.test(id)||!entry?.base64)continue;const binary=atob(entry.base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);await dbPut('payeeImages',new Blob([bytes],{type:entry.type||'image/jpeg'}),id)}}data=loaded;await save();mainNav('oversikt');notify('Backup importert')}catch(err){notify('Import feilet: '+err.message)}};input.click()}

nt.querySelector('#modal [name=value]');if(v)v.value=t.value==='amount'?Math.round(salaryNet(selectedMonth())*num(v.value)/100):salaryNet(selectedMonth())>0?Math.round(100*num(v.value)/salaryNet(selectedMonth())*10)/10:0}if(t.id==='tx-receipt'){const file=t.files?.[0];const slot=document.getElementById('image-live');if(slot&&file){if(file.type.startsWith('image/')){const url=URL.createObjectURL(file);slot.innerHTML=`<img class="imagepreview" src="${url}" alt="Forhåndsvisning av vedlegg">`;setTimeout(()=>URL.revokeObjectURL(url),60000)}else slot.textContent='Velg en bildefil.'}}});

<script>
// Only static application assets are cached. User records remain in IndexedDB/localStorage.
(function(){
  if(!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  window.addEventListener('load', async function(){
    try {
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      const el=document.getElementById('pwa-update');
      const btn=document.getElementById('pwa-update-btn');
      const check=()=>{if(reg.waiting && navigator.serviceWorker.controller) el.classList.add('show')};
      btn.addEventListener('click',()=>{if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'})}else{el.classList.remove('show')}});
      let refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
      if(reg.installing)reg.installing.addEventListener('statechange',check);
      reg.addEventListener('updatefound',()=>{if(reg.installing)reg.installing.addEventListener('statechange',check)});
      check();
    } catch(err) { console.warn('Offline-registrering ikke tilgjengelig:',err); }
  });
})();
</script>
